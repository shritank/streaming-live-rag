# FULLY PINNED CPU reference environment - every package, including transitive dependencies.
# Target: Linux x86-64, CPython 3.12 (the Docker image, Dockerfile stage 2). Resolved from the top-level list in
# requirements.lock with `pip install --dry-run --report --python-version 3.12 --platform manylinux2014_x86_64
# --only-binary=:all:`, so every pin below has a prebuilt wheel for that target (nothing builds from source).
#
#     pip install -r requirements-cpu.lock
#
# Limitations, stated plainly:
#  * It was resolved on a Windows host: pip evaluates environment markers (sys_platform, python_version) on the host,
#    not the target. The two Windows-only packages that leaked in (colorama, pyreadline3) were removed. A dependency
#    that exists only on Linux / Python 3.12 could be missing - install WITHOUT --no-deps (as above) so pip can add it.
#  * It was not built into the Docker image (Docker is not installed on the machines used so far), so the Dockerfile
#    still installs the hand-curated top-level requirements.lock. To use this file there, change
#    `COPY requirements.lock` / `pip install -r requirements.lock` to requirements-cpu.lock.
#  * The tested GPU environment is requirements-gpu.lock (Windows, CPython 3.11.9).
#  * onnxruntime here is the CPU build; never install it next to onnxruntime-gpu.
