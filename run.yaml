# Manifest for the streaming-live-rag engine (the equivalent of the
# participant kit's submission.yaml). Declares the entry point, python
# version, dependency lockfile and every environment variable the code
# reads — values themselves come from .env (git-ignored), never from here.

name: streaming-live-rag
python_version: ">=3.11,<3.13"   # numpy 2.4.6 / pandas 3.0.5 need >= 3.11
requirements: requirements.lock   # top-level pins; fully pinned: requirements-cpu.lock (Linux, py3.12), requirements-gpu.lock (tested, Windows, py3.11)

entry_points:
  replay: "python -m streaming_rag.cli replay <scenario.json> [--time-scale N] [--mode streaming|baseline]"
  live: "python -m streaming_rag.cli live"
  eval: "python -m eval.run_all"
  audio: "python tools/answer_audio.py <clip.wav> [--corpus-dir DIR] [--model DIR] [--raw]   # optional, outside the official scope"

env:
  # provider selection: fake (default, offline, zero-cost) | openai | gemini
  - name: LLM_PROVIDER
    required: false
    default: fake
  - name: LLM_MODEL
    required: false
    default: fake-model
  - name: SECRET_LLM_API_KEY
    required: false
    description: "API key for the selected LLM_PROVIDER; unused when LLM_PROVIDER=fake"
  # neural retrieval (streaming_rag/retrieval/neural.py); models are fetched once with
  # `python -m streaming_rag.retrieval.neural --fetch` and then read offline
  - name: STREAMING_RAG_CACHE
    required: false
    default: .cache/streaming_rag
    description: "where cached corpus embeddings are written"
  - name: STREAMING_RAG_ORT_THREADS
    required: false
    default: ""
    description: "ONNX Runtime intra-op threads for the encoder and cross-encoder (empty = automatic: all CPU cores on the CPU path)"
  - name: STREAMING_RAG_ORT_QUANT
    required: false
    default: ""
    description: "CPU path only: int8 | int8:ce | int8:reader to use dynamically quantised models (run `python -m streaming_rag.retrieval.neural --quantize` first); off by default, costs accuracy except int8:ce"
  - name: STREAMING_RAG_ASR_THREADS
    required: false
    default: "6"
    description: "CPU threads for the optional Whisper audio front end (streaming_rag/asr/whisper.py)"
  - name: STREAMING_RAG_ORT_PROVIDER
    required: false
    default: auto
    description: "auto (mandatory CUDA whenever an NVIDIA GPU is present - raises instead of using the CPU; CPU only on machines without one) | cuda (require GPU) | cpu (explicit opt-out); streaming_rag/gpu.py"
  - name: STREAMING_RAG_ORT_FUSED
    required: false
    default: auto
    description: "auto/1 = on CUDA use the fused-graph copies of the RAG models (python -m streaming_rag.retrieval.neural --fuse; same weights, fp32); 0 = original graphs"
  - name: STREAMING_RAG_ORT_SESSIONS
    required: false
    default: "1"
    description: "ONNX Runtime sessions per model (each its own CUDA stream); >1 only helps at >= 4 concurrent callers, the pipeline's tails were worse with 3"
  - name: STREAMING_RAG_ASR_DEVICE
    required: false
    default: auto
    description: "Whisper front end device: auto (mandatory GPU whenever an NVIDIA GPU is present) | cuda | cpu (explicit opt-out)"

corpus:
  dev_fixture: fixtures/dev_corpus       # synthetic, format-driven fixture (Task 1)
  real_sample: data/corpus               # real corpus built from SQuAD v1.1 (CC BY-SA 4.0), see data/build_squad_corpus.py
  # The official held-out corpus is dropped into data/corpus/ at grading time;
  # ingestion is format-driven, so no code change is needed to swap it in.
